version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smartcity_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smart_city_db
      MYSQL_USER: smartcity_user
      MYSQL_PASSWORD: smartcity_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: smartcity_backend
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=smartcity_user
      - MYSQL_PASSWORD=smartcity_password
      - MYSQL_DB=smart_city_db
      - SECRET_KEY=smart_city_super_secret_jwt_key_2026_x89f
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcity_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
